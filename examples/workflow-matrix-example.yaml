# ============================================================================
# AFTER: Improved Approach (< 500 lines total)
# ============================================================================
# Uses matrix strategy + reusable actions
# ============================================================================

name: Generate CI config (AFTER)
on:
  push:
    branches: ['main']
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Concurrency control to prevent duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Load repository configuration
  # ──────────────────────────────────────────────────────────────
  load-config:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.parse-config.outputs.repos }}
      sync-matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout hack repo
        uses: actions/checkout@v6

      - name: Parse repository configs
        id: parse-config
        run: |
          # Read all repo configs and output as JSON
          repos=$(find config -name "*.yaml" -exec basename {} .yaml \; | jq -R -s -c 'split("\n")[:-1]')
          echo "repos=$repos" >> $GITHUB_OUTPUT

      - name: Generate sync matrix
        id: generate-matrix
        run: |
          # Read repos.yaml (new file we'll create) and generate matrix
          matrix=$(yq eval -o=json repos.yaml | jq -c '.repositories |
            map({
              repo: .name,
              branches: .branches,
              configs: .configs
            }) |
            map(.branches as $branches | .configs as $configs | {
              repo: .repo,
              items: ($branches | map({branch: .}) as $b | $configs | map({config: .}) as $c |
                [$b, $c] | combinations | map({branch: .[0].branch, config: .[1].config}))
            }) |
            map(.items[] | {repo: .repo, branch: .branch, config: .config})
          ')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────
  # Job 2: Clone repositories (PARALLEL!)
  # ──────────────────────────────────────────────────────────────
  clone-repos:
    needs: load-config
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.load-config.outputs.repos) }}
      max-parallel: 10  # Clone 10 at a time
    steps:
      - name: Clone ${{ matrix.repo }}
        uses: actions/checkout@v6
        with:
          repository: openshift-knative/${{ matrix.repo }}
          path: repos/${{ matrix.repo }}
          token: ${{ secrets.SERVERLESS_QE_ROBOT }}

      - name: Cache cloned repo
        uses: actions/cache/save@v3
        with:
          path: repos/${{ matrix.repo }}
          key: repo-${{ matrix.repo }}-${{ github.run_id }}

  # ──────────────────────────────────────────────────────────────
  # Job 3: Generate CI configs
  # ──────────────────────────────────────────────────────────────
  generate-ci:
    needs: [load-config, clone-repos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hack repo
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true

      # Restore all cached repos
      - name: Restore cloned repos
        uses: actions/cache/restore@v3
        with:
          path: repos
          key: repo-*-${{ github.run_id }}

      - name: Checkout openshift/release
        uses: actions/checkout@v6
        with:
          repository: openshift/release
          path: openshift/release
          token: ${{ secrets.SERVERLESS_QE_ROBOT }}

      - name: Install tools
        run: |
          go install github.com/mikefarah/yq/v3@latest
          go install -tags="exclude_graphdriver_btrfs containers_image_openpgp" \
            github.com/containers/skopeo/cmd/skopeo@v1.16.1

      - name: Generate CI configurations
        run: make generate-ci-no-clean ARGS=--branch=main

      - name: Create PR to openshift/release
        if: github.event_name == 'push' && github.ref_name == 'main'
        working-directory: openshift/release
        env:
          GH_TOKEN: ${{ secrets.SERVERLESS_QE_ROBOT }}
        run: |
          git remote add fork "https://github.com/serverless-qe/release.git"
          branch="sync-serverless-ci"

          if git diff --quiet "origin/main"; then
            echo "No changes to push"
            exit 0
          fi

          git push "https://serverless-qe:${GH_TOKEN}@github.com/serverless-qe/release.git" \
            "$branch:$branch" -f
          gh pr create --base main --head "serverless-qe:$branch" --fill-verbose || true

  # ──────────────────────────────────────────────────────────────
  # Job 4: Sync configurations to repos (MATRIX STRATEGY!)
  # ──────────────────────────────────────────────────────────────
  sync-configs:
    needs: [load-config, generate-ci]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.load-config.outputs.sync-matrix) }}
      max-parallel: 20  # Process 20 PRs concurrently
      fail-fast: false  # Don't stop if one fails
    steps:
      # Use reusable action instead of copy/paste bash!
      - name: Sync ${{ matrix.config }} config to ${{ matrix.repo }}/${{ matrix.branch }}
        uses: ./.github/actions/sync-repo-config
        with:
          repo: ${{ matrix.repo }}
          branch: ${{ matrix.branch }}
          config-type: ${{ matrix.config }}
          token: ${{ secrets.SERVERLESS_QE_ROBOT }}


