---
# File: repos.yaml
# Central repository configuration (single source of truth)
repositories:
  - name: client
    branches:
      - main
      - release-v1.17
      - release-v1.21
      - release-v1.22
      - release-v1.23
    configs:
      - konflux
      - owners
      - dependabot

  - name: eventing
    branches:
      - main
      - release-v1.17
      - release-v1.21
      - release-v1.22
      - release-v1.23
    configs:
      - konflux
      - owners
      - dependabot

  - name: serving
    branches:
      - main
      - release-v1.17
      - release-v1.21
      - release-v1.22
      - release-v1.23
    configs:
      - konflux
      - owners
      - dependabot

  - name: serverless-operator
    branches:
      - main
      - release-1.37
      - release-1.38
    configs:
      - konflux
      - owners
      - dependabot

  # ... add remaining repos ...

config_types:
  konflux:
    pr_title: "[$branch] Update Konflux configurations"
    pr_body: "Update Konflux configurations"
    sync_paths:
      - .tekton/

  owners:
    pr_title: "[$branch] Update OWNERS file"
    pr_body: "Update OWNERS file"
    sync_paths:
      - OWNERS
      - OWNERS_ALIASES

  dependabot:
    pr_title: "[$branch] Update dependabot configurations"
    pr_body: "Update dependabot configurations"
    sync_paths:
      - .github/dependabot.yml

---
# File: .github/actions/sync-repo-config/action.yml
# Reusable action for syncing configs (replaces 100+ bash blocks!)
name: 'Sync Repository Config'
description: 'Sync configuration files to a target repository and branch'

inputs:
  repo:
    description: 'Target repository name'
    required: true
  branch:
    description: 'Target branch name'
    required: true
  config-type:
    description: 'Configuration type (konflux, owners, dependabot)'
    required: true
  token:
    description: 'GitHub token with repo access'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout target repo
      uses: actions/checkout@v6
      with:
        repository: openshift-knative/${{ inputs.repo }}
        ref: ${{ inputs.branch }}
        path: target-repo
        token: ${{ inputs.token }}

    - name: Sync ${{ inputs.config-type }} files
      shell: bash
      working-directory: target-repo
      run: |
        # This script handles the actual sync logic
        # Much cleaner than inline bash in workflow!
        ${{ github.action_path }}/sync.sh \
          "${{ inputs.repo }}" \
          "${{ inputs.branch }}" \
          "${{ inputs.config-type }}"

    - name: Create Pull Request
      shell: bash
      working-directory: target-repo
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        # Read PR details from repos.yaml
        pr_title=$(yq eval ".config_types.${{ inputs.config-type }}.pr_title" ../repos.yaml | \
          sed "s/\$branch/${{ inputs.branch }}/g")
        pr_body=$(yq eval ".config_types.${{ inputs.config-type }}.pr_body" ../repos.yaml)

        sync_branch="sync-${{ inputs.config-type }}-${{ inputs.branch }}"

        # Check for changes
        if git diff --quiet; then
          echo "No changes to sync"
          exit 0
        fi

        # Create/update branch and PR
        git checkout -b "$sync_branch" || git checkout "$sync_branch"
        git add .
        git commit -m "$pr_title"
        git push origin "$sync_branch" -f

        gh pr create \
          --base "${{ inputs.branch }}" \
          --head "$sync_branch" \
          --title "$pr_title" \
          --body "$pr_body" \
          || echo "PR already exists"

---
# File: .github/actions/sync-repo-config/sync.sh
#!/bin/bash
set -euo pipefail

REPO=$1
BRANCH=$2
CONFIG_TYPE=$3

echo "Syncing $CONFIG_TYPE config to $REPO/$BRANCH"

case $CONFIG_TYPE in
  konflux)
    # Copy Konflux pipeline configs
    rsync -av --delete \
      "../generated-configs/$REPO/$BRANCH/.tekton/" \
      ".tekton/"
    ;;

  owners)
    # Copy OWNERS files
    cp "../generated-configs/$REPO/OWNERS" "OWNERS" || true
    cp "../generated-configs/$REPO/OWNERS_ALIASES" "OWNERS_ALIASES" || true
    ;;

  dependabot)
    # Copy dependabot config
    mkdir -p .github
    cp "../generated-configs/$REPO/.github/dependabot.yml" \
       ".github/dependabot.yml" || true
    ;;

  *)
    echo "Unknown config type: $CONFIG_TYPE"
    exit 1
    ;;
esac

echo "Sync completed"


