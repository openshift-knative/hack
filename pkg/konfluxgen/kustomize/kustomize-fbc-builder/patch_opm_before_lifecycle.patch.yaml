# Reorder FBC tasks so run-opm-command executes before fbc-inject-lifecycle.
# Captures openshift-knative/serverless-operator#4225 so it is not reverted
# when the pipeline is regenerated from the upstream Konflux bundle.
# New wiring: clone-repository -> run-opm-command -> fbc-inject-lifecycle -> prefetch-dependencies
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: fbc-builder
spec:
  tasks:
    - name: run-opm-command
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
      runAfter:
        - clone-repository
    - name: fbc-inject-lifecycle
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.run-opm-command.results.SOURCE_ARTIFACT)
      runAfter:
        - run-opm-command
    - name: prefetch-dependencies
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.fbc-inject-lifecycle.results.SOURCE_ARTIFACT)
      runAfter:
        - fbc-inject-lifecycle
