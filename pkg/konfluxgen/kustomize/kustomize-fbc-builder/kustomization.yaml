apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../fbc-builder.yaml
patches:
  # The prefetch patch must run first: it addresses tasks/params by index in the
  # pristine upstream fbc-builder.yaml layout, before the strategic-merge patches
  # below relocate the tasks they touch.
  - path: patch_prefetch_artifact.patch.yaml
    target:
      kind: Pipeline
      name: fbc-builder
  - path: ../patch_additional_tags.patch.yaml
    target:
      kind: Pipeline
  - path: patch_opm_params.patch.yaml
    target:
      kind: Pipeline
  - path: patch_opm_before_lifecycle.patch.yaml
    target:
      kind: Pipeline
openapi:
  path: ../pipeline_schema.json
