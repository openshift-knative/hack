apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: serverless-operator-138-ec-override-snapshot
spec:
  params: 
    - name: POLICY_CONFIGURATION
      value: rhtap-releng-tenant/registry-ocp-serverless-prod
    - name: TIMEOUT
      value: "120m"
    - name: WORKERS
      value: "35"
  application: serverless-operator-138
  contexts:
    - description: Override Snapshot testing
      name: override
  resolverRef:
    params:
      - name: url
        value: 'https://github.com/openshift-knative/hack'
      - name: revision
        value: main
      - name: pathInRepo
        value: .konflux/pipelines/enterprise-contract.yaml
    resolver: git
